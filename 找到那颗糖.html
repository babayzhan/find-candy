<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>找到那颗糖</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  html, body { height: 100%; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    color: #54663f;
    background: #e3efc6;
    -webkit-font-smoothing: antialiased;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  /* 9:16 竖屏画布：始终按可视区域等比铺满，内部尺寸跟着 --u 缩放 */
  .frame {
    --u: 1;
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: min(100vw, calc(100vh * 9 / 16), 720px);
    width: min(100vw, calc(100dvh * 9 / 16), 720px);
    aspect-ratio: 9 / 16;
    border-radius: clamp(0px, calc(12px * var(--u)), 12px);
    overflow: hidden;
    background: #f2f7d6;
    box-shadow:
      0 calc(40px * var(--u)) calc(100px * var(--u)) calc(-40px * var(--u)) rgba(60, 84, 38, .55),
      0 0 0 1px rgba(255, 255, 255, .55);
  }

  /* ---------- 背景 ---------- */
  .bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  .petals {
    position: absolute;
    inset: 0;
    z-index: 1;
    overflow: hidden;
    pointer-events: none;
  }

  .petal {
    position: absolute;
    top: 0;
    width: calc(16px * var(--u));
    height: calc(16px * var(--u));
    background: #b0d485;
    border-radius: 62% 0 62% 0;
    opacity: 0;
    animation: drift linear infinite;
  }

  @keyframes drift {
    0%   { transform: translate3d(0, calc(-160px * var(--u)), 0) rotate(0deg); opacity: 0; }
    12%  { opacity: .42; }
    88%  { opacity: .38; }
    100% { transform: translate3d(calc(64px * var(--u)), calc(1340px * var(--u)), 0) rotate(320deg); opacity: 0; }
  }

  /* ---------- 版面 ---------- */
  .app {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    flex-direction: column;
    padding: clamp(16px, calc(40px * var(--u)), 40px) 0 clamp(14px, calc(34px * var(--u)), 34px);
  }

  header {
    height: clamp(96px, calc(150px * var(--u)), 150px);
    flex: none;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    text-align: center;
    padding-bottom: clamp(4px, calc(8px * var(--u)), 8px);
  }

  h1 {
    margin: 0;
    font-size: clamp(17px, calc(38px * var(--u)), 38px);
    font-weight: 500;
    letter-spacing: .18em;
    text-indent: .18em;
    color: #5d7045;
    text-shadow: 0 calc(2px * var(--u)) 0 rgba(255, 255, 255, .62);
  }

  .status {
    margin: clamp(6px, calc(10px * var(--u)), 10px) 0 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .7em;
    font-size: clamp(12px, calc(17px * var(--u)), 17px);
    letter-spacing: .08em;
    color: #6c8451;
  }

  .status .sep { opacity: .38; }

  .status .lives { color: #b5893f; }
  .status .lives.low { color: #cf7a4f; }

  .hint {
    margin: clamp(6px, calc(12px * var(--u)), 12px) 0 0;
    font-size: clamp(12px, calc(18px * var(--u)), 18px);
    letter-spacing: .06em;
    color: #7d8f63;
    min-height: 1.4em;
    padding: 0 clamp(20px, calc(40px * var(--u)), 40px);
    text-align: center;
  }

  .hint.pop { animation: pop .42s ease both; }

  @keyframes pop {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: none; }
  }

  /* ---------- 牌桌 ---------- */
  .stage {
    position: relative;
    flex: 1;
    min-height: 0;
    --cw: 155px;
    --ch: 220px;
  }

  .card {
    position: absolute;
    left: 0;
    top: 0;
    width: var(--cw);
    height: var(--ch);
    perspective: 1200px;
    transform:
      translate3d(var(--x, 0px), calc(var(--y, 0px) + var(--lift, 0px)), 0)
      rotate(var(--rot, 0deg))
      scale(calc(var(--sc, 1) * var(--lift-s, 1)));
    transform-origin: 50% 62%;
    transition:
      transform calc(.62s / var(--speed, 2)) cubic-bezier(.34, 1.3, .42, 1),
      opacity .4s ease;
    will-change: transform;
  }

  .card::after {
    content: '';
    position: absolute;
    inset: calc(-7px * var(--u));
    border-radius: calc(var(--cw) * .115);
    pointer-events: none;
    box-shadow: 0 0 0 0 rgba(245, 201, 107, 0), 0 0 0 rgba(245, 201, 107, 0);
    transition: box-shadow .45s ease;
  }

  .card.chosen::after {
    box-shadow: 0 0 0 calc(3px * var(--u)) rgba(246, 203, 112, .95), 0 0 calc(34px * var(--u)) rgba(246, 203, 112, .7);
  }

  .stage.pickable .card { cursor: pointer; }
  .card.chosen { --lift: -22px; --lift-s: 1.05; z-index: 40 !important; }

  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform .8s cubic-bezier(.52, .06, .26, 1);
  }

  .card.is-back .card-inner { transform: rotateY(180deg); }

  .face {
    position: absolute;
    inset: 0;
    border-radius: calc(var(--cw) * .085);
    overflow: hidden;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    box-shadow:
      0 calc(14px * var(--u)) calc(28px * var(--u)) calc(-12px * var(--u)) rgba(74, 98, 46, .42),
      0 calc(3px * var(--u)) calc(9px * var(--u)) rgba(74, 98, 46, .10);
    transition: box-shadow .5s ease;
  }

  /* ---------- 正面 ---------- */
  .face.front {
    background: linear-gradient(168deg, #fffef9 0%, #fcf9ee 100%);
  }

  .face.front::before {
    content: '';
    position: absolute;
    inset: 7%;
    border-radius: calc(var(--cw) * .055);
    border: 1px solid rgba(176, 198, 146, .34);
    pointer-events: none;
  }

  .face.front.blank::after {
    content: '';
    position: absolute;
    left: 50%;
    top: 50%;
    width: 18%;
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(176, 198, 146, .28), rgba(176, 198, 146, 0) 70%);
  }

  .face.front.has-candy {
    background: linear-gradient(168deg, #fffdf4 0%, #fdf3d6 100%);
  }

  .face.front.is-target {
    box-shadow:
      0 0 0 calc(2px * var(--u)) rgba(243, 201, 121, .95),
      0 0 calc(30px * var(--u)) rgba(243, 201, 121, .6),
      0 calc(14px * var(--u)) calc(28px * var(--u)) calc(-12px * var(--u)) rgba(74, 98, 46, .35);
  }

  .front-ico {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 72%;
    height: auto;
    transform: translate(-50%, -50%);
  }

  /* ---------- 背面 ---------- */
  .face.back {
    transform: rotateY(180deg);
    background:
      radial-gradient(120% 90% at 26% 8%, rgba(255,255,255,.52), rgba(255,255,255,0) 58%),
      repeating-linear-gradient(45deg, rgba(255,255,255,.085) 0 6px, rgba(255,255,255,0) 6px 13px),
      linear-gradient(158deg, #b6d98d 0%, #9cc46e 46%, #86b45c 100%);
  }

  .face.back::before {
    content: '';
    position: absolute;
    inset: 6.5%;
    border-radius: calc(var(--cw) * .055);
    border: 1.6px solid rgba(255, 252, 231, .55);
    pointer-events: none;
  }

  .face.back::after {
    content: '';
    position: absolute;
    inset: 10.5%;
    border-radius: calc(var(--cw) * .04);
    border: 1px dashed rgba(255, 252, 231, .38);
    pointer-events: none;
  }

  .badge {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
  }

  .badge-inner {
    position: relative;
    width: 52%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle at 36% 28%, #fffefa 0%, #f8f2d8 68%, #f2e8c2 100%);
    box-shadow:
      0 0 0 calc(5px * var(--u)) rgba(255, 252, 231, .22),
      0 calc(7px * var(--u)) calc(16px * var(--u)) calc(-7px * var(--u)) rgba(64, 90, 40, .55),
      inset 0 0 0 1px rgba(255, 255, 255, .7);
  }

  .badge-inner svg {
    position: absolute;
    left: 10%;
    top: 10%;
    width: 80%;
    height: 80%;
    display: block;
    transform-origin: 50% 50%;
  }

  /* ---------- 顶部小按钮 ---------- */
  .topbar {
    position: absolute;
    left: clamp(12px, calc(28px * var(--u)), 28px);
    right: clamp(12px, calc(28px * var(--u)), 28px);
    top: clamp(10px, calc(26px * var(--u)), 26px);
    z-index: 6;
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: none;
  }

  .chip {
    pointer-events: auto;
    font: inherit;
    font-size: clamp(11px, calc(15px * var(--u)), 15px);
    letter-spacing: .1em;
    color: #6c8451;
    background: rgba(255, 253, 238, .82);
    border: solid rgba(140, 180, 100, .5);
    border-width: clamp(1px, calc(1.5px * var(--u)), 1.5px);
    border-radius: 999px;
    padding: clamp(5px, calc(8px * var(--u)), 8px) clamp(11px, calc(18px * var(--u)), 18px);
    cursor: pointer;
    box-shadow: 0 calc(8px * var(--u)) calc(16px * var(--u)) calc(-12px * var(--u)) rgba(74, 98, 46, .6), inset 0 1px 0 rgba(255,255,255,.6);
    transition: background .25s ease, border-color .25s ease, transform .2s ease;
    white-space: nowrap;
  }

  .chip:active { transform: translateY(1px) scale(.97); }

  /* ---------- 底部按钮 ---------- */
  .actions {
    height: clamp(58px, calc(96px * var(--u)), 96px);
    flex: none;
    display: grid;
    place-items: center;
  }

  .shuffle-btn {
    font: inherit;
    font-size: clamp(14px, calc(19px * var(--u)), 19px);
    letter-spacing: .18em;
    text-indent: .18em;
    color: #6c8451;
    background: rgba(255, 253, 238, .78);
    border: solid rgba(140, 180, 100, .55);
    border-width: clamp(1.2px, calc(2px * var(--u)), 2px);
    border-radius: 999px;
    padding: clamp(10px, calc(14px * var(--u)), 14px) clamp(24px, calc(44px * var(--u)), 44px);
    cursor: pointer;
    box-shadow: 0 calc(10px * var(--u)) calc(20px * var(--u)) calc(-12px * var(--u)) rgba(74, 98, 46, .7), inset 0 1px 0 rgba(255,255,255,.6);
    transition: background .25s ease, border-color .25s ease, transform .2s ease, opacity .3s ease;
  }

  .shuffle-btn:active { transform: translateY(0) scale(.98); }
  .shuffle-btn[disabled] { opacity: .4; cursor: default; transform: none; }

  @media (hover: hover) and (pointer: fine) {
    .chip:hover {
      background: #fffdf0;
      border-color: #8cbb66;
      transform: translateY(-1px);
    }
    .shuffle-btn:not([disabled]):hover {
      background: #fffdf0;
      border-color: #8cbb66;
      transform: translateY(-2px);
    }
    .stage.pickable .card:hover { --lift: -14px; --lift-s: 1.035; }
    .level-item:hover { background: #fffdf0; border-color: #8cbb66; }
    .btn-primary:hover { background: linear-gradient(160deg, #a6cd78, #8dbc63); }
    .btn-ghost:hover { background: rgba(255,255,255,.9); }
  }

  /* ---------- 弹窗 ---------- */
  .overlay {
    position: absolute;
    inset: 0;
    z-index: 20;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(56, 74, 38, .34);
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .34s ease;
  }

  .overlay.show { opacity: 1; pointer-events: auto; }

  #levelSelect { z-index: 22; background: rgba(56, 74, 38, .18); }

  .modal,
  .panel {
    width: min(100%, 460px);
    max-height: 88%;
    overflow-y: auto;
    background: linear-gradient(172deg, #fffef8 0%, #f8f5e0 100%);
    border-radius: clamp(18px, calc(28px * var(--u)), 28px);
    padding: clamp(20px, calc(34px * var(--u)), 34px) clamp(18px, calc(30px * var(--u)), 30px);
    text-align: center;
    box-shadow:
      0 calc(30px * var(--u)) calc(70px * var(--u)) calc(-26px * var(--u)) rgba(46, 64, 30, .75),
      inset 0 0 0 1px rgba(255, 255, 255, .8);
    transform: scale(.94) translateY(10px);
    transition: transform .4s cubic-bezier(.2,.9,.3,1);
  }

  .overlay.show .modal,
  .overlay.show .panel { transform: none; }

  .modal h2,
  .panel h2 {
    margin: 0 0 clamp(8px, calc(12px * var(--u)), 12px);
    font-size: clamp(18px, calc(28px * var(--u)), 28px);
    font-weight: 600;
    letter-spacing: .1em;
    color: #5d7045;
  }

  .modal p,
  .panel-sub {
    margin: 0 0 clamp(16px, calc(24px * var(--u)), 24px);
    font-size: clamp(12px, calc(16px * var(--u)), 16px);
    line-height: 1.7;
    color: #7d8f63;
  }

  .modal-btns {
    display: flex;
    flex-direction: column;
    gap: clamp(8px, calc(12px * var(--u)), 12px);
  }

  .btn-primary,
  .btn-ghost {
    font: inherit;
    font-size: clamp(14px, calc(17px * var(--u)), 17px);
    letter-spacing: .12em;
    border-radius: 999px;
    padding: clamp(10px, calc(13px * var(--u)), 13px) 20px;
    cursor: pointer;
    transition: background .25s ease, border-color .25s ease, transform .2s ease;
    border: none;
  }

  .btn-primary {
    color: #fdfcf0;
    background: linear-gradient(160deg, #9cc46e, #86b45c);
    box-shadow: 0 calc(10px * var(--u)) calc(20px * var(--u)) calc(-12px * var(--u)) rgba(74, 98, 46, .9);
  }

  .btn-ghost {
    color: #6c8451;
    background: rgba(255, 255, 255, .62);
    border: solid rgba(140, 180, 100, .45);
    border-width: clamp(1px, calc(1.5px * var(--u)), 1.5px);
  }

  .btn-primary:active,
  .btn-ghost:active { transform: translateY(1px) scale(.99); }

  /* ---------- 选关 ---------- */
  .level-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: clamp(7px, calc(12px * var(--u)), 12px);
    margin: clamp(12px, calc(20px * var(--u)), 20px) 0 clamp(14px, calc(22px * var(--u)), 22px);
  }

  .level-item {
    font: inherit;
    text-align: left;
    padding: clamp(8px, calc(12px * var(--u)), 12px) clamp(9px, calc(14px * var(--u)), 14px);
    border-radius: clamp(10px, calc(16px * var(--u)), 16px);
    border: solid rgba(140, 180, 100, .42);
    border-width: clamp(1px, calc(1.5px * var(--u)), 1.5px);
    background: rgba(255, 255, 255, .6);
    cursor: pointer;
    color: #5d7045;
    transition: background .25s ease, border-color .25s ease;
    display: block;
    width: 100%;
  }

  .lv-name {
    display: block;
    font-size: clamp(13px, calc(17px * var(--u)), 17px);
    font-weight: 600;
    letter-spacing: .08em;
  }

  .lv-meta {
    display: block;
    margin-top: clamp(2px, calc(4px * var(--u)), 4px);
    font-size: clamp(10px, calc(12.5px * var(--u)), 12.5px);
    color: #8a9b70;
    letter-spacing: .02em;
  }

  /* ---------- 粒子 ---------- */
  .spark {
    position: fixed;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 99;
    animation: burst 1.15s cubic-bezier(.18,.72,.32,1) forwards;
  }

  @keyframes burst {
    0%   { transform: translate(-50%, -50%) scale(.35); opacity: 0; }
    14%  { opacity: 1; }
    100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(.9); opacity: 0; }
  }
</style>
</head>
<body>

<div class="frame" id="frame">

    <!-- 背景 -->
    <svg class="bg" viewBox="0 0 720 1280" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <linearGradient id="g-sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#fdfbe4"/>
          <stop offset="34%" stop-color="#f5f7d0"/>
          <stop offset="68%" stop-color="#e4efba"/>
          <stop offset="100%" stop-color="#d2e7a6"/>
        </linearGradient>
        <radialGradient id="g-sun" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fff7c6" stop-opacity=".95"/>
          <stop offset="58%" stop-color="#fff4bb" stop-opacity=".32"/>
          <stop offset="100%" stop-color="#fff4bb" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="g-h1" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#dcecb8"/>
          <stop offset="100%" stop-color="#cbe2a0"/>
        </linearGradient>
        <linearGradient id="g-h2" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#c7df9a"/>
          <stop offset="100%" stop-color="#b3d385"/>
        </linearGradient>
        <linearGradient id="g-h3" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#b1d284"/>
          <stop offset="100%" stop-color="#9ac46b"/>
        </linearGradient>
      </defs>

      <rect width="720" height="1280" fill="url(#g-sky)"/>
      <ellipse cx="360" cy="340" rx="460" ry="400" fill="url(#g-sun)"/>

      <g fill="#fffef2" opacity=".5">
        <ellipse cx="150" cy="268" rx="92" ry="25"/>
        <ellipse cx="206" cy="252" rx="58" ry="19"/>
        <ellipse cx="588" cy="404" rx="104" ry="27"/>
        <ellipse cx="528" cy="388" rx="62" ry="20"/>
        <ellipse cx="360" cy="148" rx="76" ry="18"/>
      </g>

      <path d="M0 1010 Q 180 936 372 992 T 720 976 V1280 H0 Z" fill="url(#g-h1)"/>
      <path d="M0 1096 Q 210 1018 410 1082 T 720 1068 V1280 H0 Z" fill="url(#g-h2)" opacity=".96"/>
      <path d="M0 1186 Q 250 1112 486 1174 T 720 1180 V1280 H0 Z" fill="url(#g-h3)" opacity=".96"/>

      <g opacity=".7">
        <g transform="translate(84,1106)">
          <rect x="-6" y="-6" width="12" height="108" rx="6" fill="#c9ae7e"/>
          <circle cx="0" cy="-32" r="56" fill="#a8d07e"/>
          <circle cx="-36" cy="6" r="36" fill="#b8dc90"/>
          <circle cx="38" cy="2" r="40" fill="#9cc96f"/>
        </g>
        <g transform="translate(642,1088)">
          <rect x="-6" y="-6" width="12" height="118" rx="6" fill="#c9ae7e"/>
          <circle cx="0" cy="-34" r="60" fill="#a6cf7c"/>
          <circle cx="42" cy="4" r="38" fill="#b7dc8e"/>
          <circle cx="-38" cy="0" r="34" fill="#9bc86e"/>
        </g>
      </g>

      <g fill="#fffbe0" opacity=".8">
        <circle cx="176" cy="1218" r="4.5"/>
        <circle cx="300" cy="1246" r="3.6"/>
        <circle cx="470" cy="1230" r="4"/>
        <circle cx="594" cy="1252" r="4.6"/>
        <circle cx="80" cy="1246" r="3.4"/>
      </g>
    </svg>

    <div class="petals" id="petals" aria-hidden="true"></div>

    <div class="topbar">
      <button class="chip" id="levelBtn" type="button">选关</button>
      <button class="chip" id="restartBtn" type="button">重开</button>
    </div>

    <!-- 主体 -->
    <main class="app">
      <header>
        <h1>找到那颗糖</h1>
        <p class="status">
          <span id="levelTag">第 1 关</span>
          <span class="sep">·</span>
          <span class="lives" id="livesTag">机会 3 / 3</span>
        </p>
        <p class="hint" id="hint">记住糖果在哪张牌上</p>
      </header>
      <div class="stage" id="stage"></div>
      <div class="actions">
        <button class="shuffle-btn" id="shuffleBtn" type="button" disabled>洗牌</button>
      </div>
    </main>

    <!-- 结果弹窗 -->
    <div class="overlay" id="overlay">
      <div class="modal">
        <h2 id="modalTitle">没找到糖果</h2>
        <p id="modalText"></p>
        <div class="modal-btns">
          <button class="btn-primary" id="modalPrimary" type="button">重试本关</button>
          <button class="btn-ghost" id="modalSecondary" type="button">选择关卡</button>
        </div>
      </div>
    </div>

    <!-- 选关面板 -->
    <div class="overlay" id="levelSelect">
      <div class="panel">
        <h2>选择难度</h2>
        <p class="panel-sub">十关递进 · 找到藏在牌背面的那颗糖</p>
        <div class="level-grid" id="levelGrid"></div>
        <button class="btn-ghost" id="levelClose" type="button">返回</button>
      </div>
    </div>

</div>

<script>
(function () {
  'use strict';

  const DESIGN_W = 720;

  /* ---------- 十个关卡 ---------- */
  // count: 牌数 / cols: 网格列数（0 = 五边形）/ attempts: 点击机会 / speed: 洗牌速度倍数
  const LEVELS = [
    { count: 5,  cols: 0, attempts: 3, speed: 2.0 },
    { count: 7,  cols: 4, attempts: 3, speed: 2.0 },
    { count: 7,  cols: 4, attempts: 3, speed: 3.0 },
    { count: 9,  cols: 3, attempts: 3, speed: 3.0 },
    { count: 9,  cols: 3, attempts: 3, speed: 4.0 },
    { count: 11, cols: 4, attempts: 2, speed: 4.5 },
    { count: 12, cols: 4, attempts: 2, speed: 5.5 },
    { count: 12, cols: 4, attempts: 2, speed: 6.5 },
    { count: 14, cols: 5, attempts: 2, speed: 8.0 },
    { count: 15, cols: 5, attempts: 2, speed: 10.0 }
  ];

  const frame = document.getElementById('frame');
  const stage = document.getElementById('stage');
  const hint = document.getElementById('hint');
  const levelTag = document.getElementById('levelTag');
  const livesTag = document.getElementById('livesTag');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const levelBtn = document.getElementById('levelBtn');
  const restartBtn = document.getElementById('restartBtn');

  const overlay = document.getElementById('overlay');
  const modalTitle = document.getElementById('modalTitle');
  const modalText = document.getElementById('modalText');
  const modalPrimary = document.getElementById('modalPrimary');
  const modalSecondary = document.getElementById('modalSecondary');

  const levelSelect = document.getElementById('levelSelect');
  const levelGrid = document.getElementById('levelGrid');
  const levelClose = document.getElementById('levelClose');

  const cards = [];
  let slotOf = [];
  let layoutCfg = null;

  let levelIdx = 0;
  let count = 5;
  let targetIdx = 0;
  let targetName = '';
  let targetBody = '';
  let attemptsLeft = 3;
  let speed = 2;

  let phase = 'idle';
  let runId = 0;
  let modalActions = { primary: null, secondary: null };

  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const randInt = (n) => Math.floor(Math.random() * n);

  /* ---------- 画布缩放 ---------- */
  function fitFrame() {
    const w = frame.clientWidth || DESIGN_W;
    frame.style.setProperty('--u', (w / DESIGN_W).toFixed(4));
  }

  /* ---------- 螺旋（棒棒糖花纹） ---------- */
  function spiralPath(cx, cy, turns, r0, r1, steps) {
    steps = steps || 220;
    let d = '';
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      const a = -Math.PI / 2 + t * turns * Math.PI * 2;
      const r = r0 + (r1 - r0) * t;
      const x = cx + Math.cos(a) * r;
      const y = cy + Math.sin(a) * r;
      d += (i === 0 ? 'M' : 'L') + x.toFixed(2) + ' ' + y.toFixed(2);
    }
    return d;
  }

  const SPIRAL_D = spiralPath(50, 38, 2.45, 4.2, 17.6);

  /* ---------- 糖果图案 ---------- */
  const PATTERNS = [
    {
      name: '棒棒糖',
      body: `
        <circle cx="50" cy="42" r="36" fill="#fdf3d4" opacity=".72"/>
        <circle cx="50" cy="38" r="26" fill="#fff7e0" stroke="#edc47b" stroke-width="2.4"/>
        <path d="${SPIRAL_D}" fill="none" stroke="#f0a95f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M50 64 L45 90" stroke="#e2cda1" stroke-width="5.4" stroke-linecap="round"/>
        <g fill="#f3c86d" opacity=".8">
          <circle cx="22" cy="24" r="2.4"/><circle cx="79" cy="30" r="2"/><circle cx="72" cy="76" r="2.2"/>
        </g>`
    },
    {
      name: '薄荷糖',
      body: `
        <circle cx="50" cy="50" r="27" fill="#f7fae8" stroke="#a9c77e" stroke-width="2.6"/>
        <g stroke="#cfe3a6" stroke-width="4.2" stroke-linecap="round">
          <path d="M50 50 L50 27"/><path d="M50 50 L66.3 33.7"/><path d="M50 50 L73 50"/>
          <path d="M50 50 L66.3 66.3"/><path d="M50 50 L50 73"/><path d="M50 50 L33.7 66.3"/>
          <path d="M50 50 L27 50"/><path d="M50 50 L33.7 33.7"/>
        </g>
        <circle cx="50" cy="50" r="6.5" fill="#f0cf87" stroke="#e2b96a" stroke-width="1.6"/>`
    },
    {
      name: '软糖',
      body: `
        <rect x="25" y="25" width="50" height="50" rx="15" fill="#f8cbae" stroke="#e4a985" stroke-width="2.6"/>
        <path d="M36 39 q 7 -6 15 -4" fill="none" stroke="#ffe6d5" stroke-width="3.4" stroke-linecap="round"/>
        <g fill="#fff2e7" opacity=".92">
          <circle cx="60" cy="58" r="2.2"/><circle cx="46" cy="64" r="1.7"/><circle cx="55" cy="46" r="1.5"/>
        </g>`
    },
    {
      name: '星星糖',
      body: `
        <path d="M50 22 l8.2 16.6 18.3 2.7 -13.2 12.9 3.1 18.2 -16.4 -8.6 -16.4 8.6 3.1 -18.2 -13.2 -12.9 18.3 -2.7 z"
          fill="#f9dd93" stroke="#e7bd64" stroke-width="2.6" stroke-linejoin="round"/>
        <circle cx="50" cy="49" r="4.6" fill="#fff8dd" opacity=".95"/>`
    },
    {
      name: '奶糖',
      body: `
        <path d="M31 50 L15 35 L15 65 Z" fill="#f9dde7" stroke="#dea7ba" stroke-width="2.4" stroke-linejoin="round"/>
        <path d="M69 50 L85 35 L85 65 Z" fill="#f9dde7" stroke="#dea7ba" stroke-width="2.4" stroke-linejoin="round"/>
        <ellipse cx="50" cy="50" rx="21" ry="16" fill="#f6c8d7" stroke="#dea7ba" stroke-width="2.6"/>
        <path d="M39 43 q11 7 22 0" fill="none" stroke="#eaaec1" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M39 57 q11 7 22 0" fill="none" stroke="#eaaec1" stroke-width="2.2" stroke-linecap="round" opacity=".8"/>`
    }
  ];

  const LEAF_BADGE = `
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <path d="M50 17C62 28 71 42 71 55c0 14-9 24-21 28-12-4-21-14-21-28 0-13 9-27 21-38z" fill="#8cc266"/>
      <path d="M50 80V28" stroke="#699f47" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M50 44l9 5M50 56l9 5M50 68l9 5M50 44l-9 5M50 56l-9 5" fill="none" stroke="#7bb354" stroke-width="2.1" stroke-linecap="round"/>
    </svg>`;

  /* ---------- 构建卡片 ---------- */
  function buildCards(n) {
    stage.innerHTML = '';
    cards.length = 0;

    for (let i = 0; i < n; i++) {
      const isTarget = i === targetIdx;
      const el = document.createElement('div');
      el.className = 'card';
      el.dataset.idx = String(i);
      el.style.transition = 'none';
      el.innerHTML = `
        <div class="card-inner">
          <div class="face front ${isTarget ? 'has-candy' : 'blank'}">
            ${isTarget ? '<svg class="front-ico" viewBox="0 0 100 100" aria-hidden="true">' + targetBody + '</svg>' : ''}
          </div>
          <div class="face back">
            <div class="badge">
              <div class="badge-inner">${LEAF_BADGE}</div>
            </div>
          </div>
        </div>`;
      stage.appendChild(el);
      cards.push({ el });
    }
  }

  /* ---------- 阵型 ---------- */
  function pentagon(count, cw, ch, stageW, stageH) {
    const rotMax = 11 * Math.PI / 180;
    const bw = cw * Math.cos(rotMax) + ch * Math.sin(rotMax);
    const R = Math.max(100, Math.min(
      (stageW / 2 - bw / 2 - 14) / 0.951,
      stageH / 2 - ch / 2 - 14
    ));

    const arr = [];
    for (let i = 0; i < count; i++) {
      const a = -Math.PI / 2 + i * (Math.PI * 2 / 5);
      arr.push({
        x: Math.cos(a) * R,
        y: Math.sin(a) * R,
        rot: Math.sin(a + Math.PI / 2) * 11
      });
    }
    return { cw, ch, positions: arr };
  }

  function gridFormation(count, cols, stageW, stageH) {
    const gapRatio = 0.14;
    const marginX = Math.max(10, stageW * 0.04);
    const marginY = 14;
    const availW = stageW - marginX * 2;
    const availH = stageH - marginY * 2;

    const rows = Math.ceil(count / cols);
    const byW = availW / (cols + gapRatio * (cols - 1));
    const byH = availH / (1.42 * rows + gapRatio * (rows - 1));

    const cw = Math.max(34, Math.floor(Math.min(byW, byH)));
    const ch = Math.round(cw * 1.42);
    const gap = cw * gapRatio;

    const totalH = rows * ch + (rows - 1) * gap;
    const positions = [];

    for (let r = 0; r < rows; r++) {
      const inRow = Math.min(cols, count - r * cols);
      const rowW = inRow * cw + (inRow - 1) * gap;
      for (let c = 0; c < inRow; c++) {
        positions.push({
          x: -rowW / 2 + c * (cw + gap) + cw / 2,
          y: -totalH / 2 + r * (ch + gap) + ch / 2,
          rot: 0
        });
      }
    }
    return { cw, ch, positions };
  }

  function buildFormation(n, cols, stageW, stageH) {
    if (n === 5) {
      const cw = Math.round(stageW * 0.215);
      return pentagon(n, cw, Math.round(cw * 1.42), stageW, stageH);
    }
    return gridFormation(n, cols, stageW, stageH);
  }

  function place(idx, slot) {
    if (!layoutCfg) return;
    const { cx, cy, cw, ch, formation } = layoutCfg;
    const pos = formation[Math.max(0, Math.min(slot, formation.length - 1))];
    if (!pos) return;

    const el = cards[idx].el;
    el.style.setProperty('--x', (cx + pos.x - cw / 2).toFixed(1) + 'px');
    el.style.setProperty('--y', (cy + pos.y - ch / 2).toFixed(1) + 'px');
    el.style.setProperty('--rot', (pos.rot || 0).toFixed(2) + 'deg');
    el.style.setProperty('--sc', '1');
  }

  function layout() {
    if (!cards.length) return;

    const stageW = stage.clientWidth || DESIGN_W;
    const stageH = stage.clientHeight || 900;
    const cfg = LEVELS[levelIdx];
    const built = buildFormation(count, cfg.cols, stageW, stageH);

    layoutCfg = {
      cx: stageW / 2,
      cy: stageH / 2,
      cw: built.cw,
      ch: built.ch,
      formation: built.positions
    };

    stage.style.setProperty('--cw', built.cw + 'px');
    stage.style.setProperty('--ch', built.ch + 'px');

    for (let i = 0; i < count; i++) place(i, slotOf[i]);
  }

  /* ---------- 翻牌 ---------- */
  function allIdx() {
    const arr = [];
    for (let i = 0; i < count; i++) arr.push(i);
    return arr;
  }

  function flipCards(list, toBack, stagger) {
    stagger = stagger === undefined ? 70 : stagger;
    return new Promise((resolve) => {
      list.forEach((idx, k) => {
        setTimeout(() => cards[idx].el.classList.toggle('is-back', toBack), k * stagger);
      });
      setTimeout(resolve, Math.max(0, list.length - 1) * stagger + 800);
    });
  }

  /* ---------- 洗牌 ---------- */
  async function swapCards(a, b) {
    if (a === b || slotOf[a] === slotOf[b]) return;
    const A = cards[a].el;
    const B = cards[b].el;
    const sa = slotOf[a];
    const sb = slotOf[b];
    const dir = sa < sb ? 1 : -1;

    A.style.zIndex = '30';
    B.style.zIndex = '24';

    const ch = layoutCfg ? layoutCfg.ch : 220;
    placeWithLift(a, sa, -Math.round(ch * (0.18 + Math.random() * 0.06)), dir * (6 + Math.random() * 3), 1.045);
    placeWithLift(b, sb, Math.round(ch * (0.12 + Math.random() * 0.05)), -dir * (4 + Math.random() * 3), 1.02);

    await wait(200 / speed);

    slotOf[a] = sb;
    slotOf[b] = sa;
    place(a, sb);
    place(b, sa);

    await wait(430 / speed);

    A.style.zIndex = '';
    B.style.zIndex = '';
  }

  function placeWithLift(idx, slot, yOff, extraRot, scale) {
    if (!layoutCfg) return;
    const { cx, cy, cw, ch, formation } = layoutCfg;
    const pos = formation[Math.max(0, Math.min(slot, formation.length - 1))];
    if (!pos) return;
    const el = cards[idx].el;
    el.style.setProperty('--x', (cx + pos.x - cw / 2).toFixed(1) + 'px');
    el.style.setProperty('--y', (cy + pos.y - ch / 2 + yOff).toFixed(1) + 'px');
    el.style.setProperty('--rot', ((pos.rot || 0) + extraRot).toFixed(2) + 'deg');
    el.style.setProperty('--sc', String(scale));
  }

  async function doShuffle() {
    if (count < 2) return;
    const total = count <= 7 ? 6 : (count <= 11 ? 7 : 8);

    for (let k = 0; k < total; k++) {
      let a = randInt(count);
      let b = randInt(count);
      let guard = 0;
      while (a === b && guard++ < 30) b = randInt(count);
      if (a === b) continue;
      await swapCards(a, b);
    }
  }

  /* ---------- HUD ---------- */
  function updateHUD() {
    levelTag.textContent = '第 ' + (levelIdx + 1) + ' 关';
    livesTag.textContent = '机会 ' + attemptsLeft + ' / ' + LEVELS[levelIdx].attempts;
    livesTag.classList.toggle('low', attemptsLeft <= 1);
  }

  function setHint(text) {
    hint.classList.remove('pop');
    void hint.offsetWidth;
    hint.textContent = text;
    hint.classList.add('pop');
  }

  /* ---------- 粒子 ---------- */
  function burst(x, y) {
    const colors = ['#f6ca6c', '#eaa96c', '#a8cf7f', '#f6e3a3', '#cfe4a5', '#f3bccd'];
    for (let i = 0; i < 26; i++) {
      const p = document.createElement('i');
      p.className = 'spark';
      p.style.left = x + 'px';
      p.style.top = y + 'px';
      p.style.background = colors[i % colors.length];
      const ang = Math.random() * Math.PI * 2;
      const dist = 60 + Math.random() * 170;
      p.style.setProperty('--tx', (Math.cos(ang) * dist).toFixed(0) + 'px');
      p.style.setProperty('--ty', (Math.sin(ang) * dist - 50).toFixed(0) + 'px');
      p.style.width = p.style.height = (7 + Math.random() * 6).toFixed(0) + 'px';
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 1200);
    }
  }

  /* ---------- 弹窗 ---------- */
  function showModal(opts) {
    modalTitle.textContent = opts.title;
    modalText.textContent = opts.text;
    modalPrimary.textContent = opts.primary;
    modalSecondary.textContent = opts.secondary;
    modalActions.primary = opts.onPrimary;
    modalActions.secondary = opts.onSecondary;
    modalActions.keepModal = !!opts.keepModal;
    modalSecondary.style.display = opts.secondary ? '' : 'none';
    overlay.classList.add('show');
  }

  function hideModal() {
    overlay.classList.remove('show');
  }

  modalPrimary.addEventListener('click', () => {
    const fn = modalActions.primary;
    hideModal();
    if (fn) fn();
  });

  modalSecondary.addEventListener('click', () => {
    const fn = modalActions.secondary;
    if (!modalActions.keepModal) hideModal();
    if (fn) fn();
  });

  /* ---------- 选关 ---------- */
  function buildLevelGrid() {
    levelGrid.innerHTML = '';
    LEVELS.forEach((cfg, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'level-item';
      b.innerHTML = '<span class="lv-name">第 ' + (i + 1) + ' 关</span>' +
                    '<span class="lv-meta">' + cfg.count + ' 张 · ' + cfg.attempts + ' 次机会 · 速度 ×' + cfg.speed + '</span>';
      b.addEventListener('click', () => {
        closeLevels();
        startLevel(i);
      });
      levelGrid.appendChild(b);
    });
  }

  function openLevels() {
    levelSelect.classList.add('show');
  }

  function closeLevels() {
    levelSelect.classList.remove('show');
  }

  levelBtn.addEventListener('click', openLevels);
  levelClose.addEventListener('click', closeLevels);

  levelSelect.addEventListener('click', (e) => {
    if (e.target === levelSelect) closeLevels();
  });

  /* ---------- 开始某一关 ---------- */
  async function startLevel(i) {
    const my = ++runId;

    levelIdx = i;
    const cfg = LEVELS[i];
    count = cfg.count;
    attemptsLeft = cfg.attempts;
    speed = cfg.speed;

    hideModal();
    phase = 'prepare';
    stage.classList.remove('pickable');
    shuffleBtn.disabled = true;

    // 随机挑一种糖果当目标
    const p = PATTERNS[randInt(PATTERNS.length)];
    targetName = p.name;
    targetBody = p.body;
    targetIdx = randInt(count);

    slotOf = [];
    for (let k = 0; k < count; k++) slotOf.push(k);

    buildCards(count);
    layout();
    updateHUD();

    stage.style.setProperty('--speed', String(speed));

    requestAnimationFrame(() => {
      cards.forEach((c) => { c.el.style.transition = ''; });
    });

    phase = 'preview';
    const showMs = Math.max(1300, 2400 - i * 110);
    setHint('记住这颗「' + targetName + '」在哪张牌上');

    await wait(showMs);
    if (my !== runId) return;

    phase = 'turn';
    setHint('翻到背面，牌面看起来全都一样…');
    await flipCards(allIdx(), true, 40);
    if (my !== runId) return;

    await wait(240);
    if (my !== runId) return;

    phase = 'shuffle';
    setHint('牌在打乱，眼睛别眨');
    await doShuffle();
    if (my !== runId) return;

    beginPick();
  }

  function beginPick() {
    phase = 'pick';
    stage.classList.add('pickable');
    shuffleBtn.disabled = false;
    setHint('糖果藏在哪张牌后面？还能点 ' + attemptsLeft + ' 次');
  }

  /* ---------- 点击 ---------- */
  async function pickCard(idx) {
    if (phase !== 'pick') return;
    const my = runId;

    phase = 'reveal';
    stage.classList.remove('pickable');
    shuffleBtn.disabled = true;

    const el = cards[idx].el;
    const hit = idx === targetIdx;

    el.classList.add('chosen');
    el.classList.remove('is-back');
    await wait(700);
    if (my !== runId) return;

    if (hit) {
      const r = el.getBoundingClientRect();
      burst(r.left + r.width / 2, r.top + r.height / 2);
      setHint('找到啦！就是这颗「' + targetName + '」');
      await wait(1400);
      if (my !== runId) return;
      nextLevel();
      return;
    }

    // 点错了
    attemptsLeft--;
    updateHUD();
    el.classList.remove('chosen');
    setHint('这里没有糖果，再找找');
    await wait(520);
    if (my !== runId) return;

    if (attemptsLeft <= 0) {
      phase = 'failed';
      setHint('机会用完了…');
      await flipCards(allIdx(), false, 50);
      if (my !== runId) return;
      cards[targetIdx].el.querySelector('.face.front').classList.add('is-target');
      await wait(500);
      if (my !== runId) return;
      showModal({
        title: '没找到糖果',
        text: '糖果藏在亮起来的那张牌后面。再试一次吧。',
        primary: '重试本关',
        secondary: '选择关卡',
        keepModal: true,
        onPrimary: () => startLevel(levelIdx),
        onSecondary: openLevels
      });
      return;
    }

    el.classList.add('is-back');
    await wait(520);
    if (my !== runId) return;

    beginPick();
  }

  function nextLevel() {
    if (levelIdx + 1 < LEVELS.length) {
      startLevel(levelIdx + 1);
      return;
    }

    phase = 'done';
    setHint('十关全部完成');
    cards[targetIdx].el.querySelector('.face.front').classList.add('is-target');
    showModal({
      title: '十关全通！',
      text: '你找到了所有糖果，反应和记忆都很稳。',
      primary: '从第一关再来',
      secondary: '选择关卡',
      keepModal: true,
      onPrimary: () => startLevel(0),
      onSecondary: openLevels
    });
  }

  /* ---------- 手动洗牌 ---------- */
  shuffleBtn.addEventListener('click', async () => {
    if (phase !== 'pick') return;
    const my = runId;

    phase = 'shuffle';
    shuffleBtn.disabled = true;
    stage.classList.remove('pickable');
    setHint('自己洗一次 · 盯紧它');
    await doShuffle();
    if (my !== runId) return;

    beginPick();
  });

  restartBtn.addEventListener('click', () => {
    startLevel(levelIdx);
  });

  /* ---------- 牌桌点击 ---------- */
  stage.addEventListener('click', (e) => {
    if (phase !== 'pick') return;
    const el = e.target.closest('.card');
    if (!el) return;
    pickCard(Number(el.dataset.idx));
  });

  /* ---------- 飘叶 ---------- */
  (function makePetals() {
    const box = document.getElementById('petals');
    for (let i = 0; i < 9; i++) {
      const p = document.createElement('i');
      p.className = 'petal';
      p.style.left = (Math.random() * 100).toFixed(1) + '%';
      p.style.animationDuration = (14 + Math.random() * 12).toFixed(1) + 's';
      p.style.animationDelay = (-Math.random() * 20).toFixed(1) + 's';
      const s = 0.75 + Math.random() * 0.85;
      p.style.width = 'calc(' + (14 * s).toFixed(1) + 'px * var(--u))';
      p.style.height = p.style.width;
      p.style.background = Math.random() > 0.45 ? '#b0d485' : '#f3d98b';
      box.appendChild(p);
    }
  })();

  /* ---------- 启动 ---------- */
  fitFrame();
  buildLevelGrid();

  let resizeTimer = null;
  function handleViewportChange() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      fitFrame();
      if (phase === 'shuffle' || phase === 'reveal') return;
      layout();
    }, 160);
  }

  window.addEventListener('resize', handleViewportChange);
  window.addEventListener('orientationchange', handleViewportChange);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', handleViewportChange);
  }

  startLevel(0);
})();
</script>
